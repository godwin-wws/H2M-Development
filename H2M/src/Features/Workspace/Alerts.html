      <!-- Page Title -->

      <!-- Dashboard Style Card Wrapper (Dynamic Height Hugs Content) -->

        <!-- Top Card Header & M3 Pagination Controls -->

          <!-- M3 Circular Pagination Controls -->

              <button 
                id="prev-page-btn"

              <button

                onclick="changePage(1)" 
                class="w-8 h-8 rounded-full flex items-center justify-center text-[#49454F] hover:bg-[#F3EDF7] active:bg-[#E8DEF8] transition-colors duration-200 outline-none disabled:opacity-38 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                title="Next page"
              >
                <span class="material-symbols-outlined text-[20px] leading-none select-none">navigate_next</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Scrollable List Container -->
        <div id="alerts-container" class="divide-y divide-line overflow-y-auto flex-1 min-h-0">

  <!-- Toast Container -->
  <div id="toast-notification" class="fixed bottom-5 right-5 bg-[#1C1B1F] text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

  <script>
    // Compiled exceptions feed extracted directly from H2M_Bridge_Intake.xlsx
    const alertsData = [
      { orderId: 'ORD-000867', type: 'Prescription Requested', description: 'Prescription request sent to provider for Brianna Treadway. Pending response.', timeAgo: '12 min ago', iconType: 'info', iconBg: 'bg-blue-bg', iconColor: 'text-blue' },
      { orderId: 'ORD-000868', type: 'Physician Info Requested', description: 'Provider details incomplete for Laura Mabry. Awaiting info.', timeAgo: '45 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000869', type: 'Physician Info Requested', description: 'Provider details incomplete for Madison Chilcutt. Awaiting info.', timeAgo: '2 hrs ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000871', type: 'Physician Info Requested', description: 'Provider details incomplete for Sinthia Abrego. Awaiting info.', timeAgo: '12 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000872', type: 'Prescription Requested', description: 'Prescription request sent to provider for Suheda Begum. Pending response.', timeAgo: '45 min ago', iconType: 'info', iconBg: 'bg-blue-bg', iconColor: 'text-blue' },
      { orderId: 'ORD-000873', type: 'Prescription Requested', description: 'Prescription request sent to provider for Leticia Delarosa. Pending response.', timeAgo: '2 hrs ago', iconType: 'info', iconBg: 'bg-blue-bg', iconColor: 'text-blue' },
      { orderId: 'ORD-000874', type: 'Physician Info Requested', description: 'Provider details incomplete for Hayley Gow. Awaiting info.', timeAgo: '12 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000875', type: 'Physician Info Requested', description: 'Provider details incomplete for Doris Manchame. Awaiting info.', timeAgo: '45 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000876', type: 'Prescription Requested', description: 'Prescription request sent to provider for Peyton Tockey. Pending response.', timeAgo: '2 hrs ago', iconType: 'info', iconBg: 'bg-blue-bg', iconColor: 'text-blue' },
      { orderId: 'ORD-000877', type: 'Missing Fax Number', description: 'Fax number is absent for physician on order. Manual lookup required for Leah Garcia.', timeAgo: '12 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-000878', type: 'Missing Fax Number', description: 'Fax number is absent for physician on order. Manual lookup required for Sarah Albertson.', timeAgo: '45 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-000879', type: 'Missing Fax Number', description: 'Fax number is absent for physician on order. Manual lookup required for Elizabeth Lyi.', timeAgo: '2 hrs ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-000880', type: 'Physician Info Requested', description: 'Provider details incomplete for Jade Blasdell. Awaiting info.', timeAgo: '12 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000881', type: 'Physician Info Requested', description: 'Provider details incomplete for Kaylee Kemp. Awaiting info.', timeAgo: '45 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-000884', type: 'Missing Fax Number', description: 'Fax number is absent for physician on order. Manual lookup required for Linda Winland.', timeAgo: '2 hrs ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-000886', type: 'Missing Fax Number', description: 'Fax number is absent for physician on order. Manual lookup required for Stefany Sanchez.', timeAgo: '12 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100465', type: 'Missing Kit Auth', description: 'Required kit authorization form not received. Routed to Waiting queue for Madison Chilcutt.', timeAgo: '45 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-100471', type: 'NPI Mismatch', description: 'Inbound provider NPI does not match directory record for Sari Gutierrez.', timeAgo: '2 hrs ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-100482', type: 'Duplicate Record', description: 'Duplicate record matched on (Order ID / Email / Composite Patient Profile) for Priya Nair.', timeAgo: '15 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100401', type: 'Invalid Name', description: 'Last Name must contain text characters only. Found digits or symbols.', timeAgo: '30 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100402', type: 'Missing Req Field', description: 'Address is required and cannot be empty.', timeAgo: '45 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100404', type: 'Missing Req Field', description: 'Insurance Member ID is required. (Cheyenne Michelle Bailey)', timeAgo: '60 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100405', type: 'Missing Physician Info', description: 'Physician NPI and Fax missing. Match not found in Provider Directory. (Dorimar Cruz)', timeAgo: '75 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' },
      { orderId: 'ORD-100407', type: 'Invalid City', description: 'City must contain text characters only. Found: Cape Coral 01.', timeAgo: '90 min ago', iconType: 'error', iconBg: 'bg-red-bg', iconColor: 'text-red' },
      { orderId: 'ORD-100409', type: 'Missing Physician Info', description: 'Physician NPI and Fax missing. Match not found in Provider Directory. (Sade N Goodluck)', timeAgo: '105 min ago', iconType: 'warning', iconBg: 'bg-amber-bg', iconColor: 'text-amber' }
    ];

    let currentPage = 1;
    const pageSize = 10;

    function renderIcons(type, colorClass) {
      if (type === 'info') {
        return `<span class="material-symbols-outlined text-[20px] ${colorClass}">info</span>`;
      } else if (type === 'clock') {
        return `<span class="material-symbols-outlined text-[20px] ${colorClass}">schedule</span>`;
      } else if (type === 'warning') {
        return `<span class="material-symbols-outlined text-[20px] ${colorClass}">warning</span>`;
      } else {
        return `<span class="material-symbols-outlined text-[20px] ${colorClass}">error</span>`;
      }
    }

    function renderAlerts() {
      const totalItems = alertsData.length;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = Math.min(startIndex + pageSize, totalItems);
      const paginatedData = alertsData.slice(startIndex, endIndex);

      const container = document.getElementById('alerts-container');

      if (!paginatedData.length) {
        container.innerHTML = `<div class="p-8 text-center text-muted text-sm">No active alerts found.</div>`;
      } else {
        container.innerHTML = paginatedData.map(item => `
          <div class="px-6 py-4 flex items-center justify-between hover:bg-[#F3EDF7]/50 transition cursor-pointer group" onclick="navigateToOrderDetails('${item.orderId}')">
            <div class="flex items-center gap-4">
              <div class="w-10 h-10 rounded-full ${item.iconBg} flex items-center justify-center shrink-0">
                ${renderIcons(item.iconType, item.iconColor)}
              </div>
              <div class="flex flex-col gap-0.5">
                <div class="text-sm font-bold text-text">
                  <span class="font-mono font-bold text-text">${item.orderId}</span> - <span>${item.type}</span>
                </div>
                <div class="text-xs text-muted font-normal">
                  ${item.description}
                </div>
              </div>
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs text-muted font-normal">${item.timeAgo}</span>
              <span class="material-symbols-outlined text-[16px] text-muted opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition">chevron_right</span>
            </div>
          </div>
        `).join('');
      }

      // Update Pagination Indicator Controls
      const statusText = totalItems > 0 
        ? `Showing ${startIndex + 1}-${endIndex} of ${totalItems}`
        : `Showing 0-0 of 0`;

      document.getElementById('pagination-status').innerText = statusText;
      document.getElementById('prev-page-btn').disabled = currentPage === 1;
      document.getElementById('next-page-btn').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      const totalPages = Math.ceil(alertsData.length / pageSize) || 1;
      const newPage = currentPage + direction;
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderAlerts();
      }
    }

    // Direct link to OrderDetailsView.html with origin=alerts
    function navigateToOrderDetails(orderId) {
      window.location.href = `OrderDetails/OrderDetailsView.html?orderId=${orderId}&origin=alerts`;
    }

    // Role Switcher Logic
    let activeRole = 'operations';
    let roleSwitcherOpen = false;

    const roleData = {
      operations: { name: 'Jane Doe', email: 'jane.doe@h2m.org', initials: 'J', color: '#6750a4', label: 'Operations' },
      administrator: { name: 'Priya Patel', email: 'p.patel@h2m.org', initials: 'P', color: '#1967D2', label: 'Administrator' }
    };

    document.getElementById('role-switcher-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      roleSwitcherOpen = !roleSwitcherOpen;
      document.getElementById('role-switcher-dropdown').classList.toggle('hidden', !roleSwitcherOpen);
    });

    document.addEventListener('click', (e) => {
      const container = document.getElementById('role-switcher-container');
      if (container && !container.contains(e.target)) {
        roleSwitcherOpen = false;
        document.getElementById('role-switcher-dropdown').classList.add('hidden');
      }
    });

    function selectRole(role) {
      activeRole = role;
      roleSwitcherOpen = false;
      document.getElementById('role-switcher-dropdown').classList.add('hidden');

      const current = roleData[role];
      const avatar = document.getElementById('active-avatar');
      avatar.style.backgroundColor = current.color;
      avatar.innerText = current.initials;

      document.getElementById('active-name').innerText = current.name;
      const label = document.getElementById('active-label');
      label.innerText = current.label;
      label.style.color = current.color;

      const opsBtn = document.getElementById('role-opt-operations');
      const adminBtn = document.getElementById('role-opt-administrator');
      const checkOps = document.getElementById('check-operations');
      const checkAdmin = document.getElementById('check-administrator');

      if (role === 'operations') {
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkOps.classList.remove('hidden');
        checkAdmin.classList.add('hidden');
      } else {
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkAdmin.classList.remove('hidden');
        checkOps.classList.add('hidden');
      }

      showToast(`Switched to ${current.label} view — ${current.name}`);
    }

    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    renderAlerts();
  </script>
</body>
