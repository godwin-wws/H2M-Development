  <script>
    const orders = [
      { id: 'ORD-000867', firstName: 'Brianna', lastName: 'Treadway', dob: '03/16/2006', provider: 'Diana Health, Springfield Tennessee', product: 'Momcozy Double Wearable Breast Pump', insurance: 'United Healthcare Community Plan', sourceStatus: 'Prescription Requested', statusClass: 'bg-blue-bg text-blue', date: '10/27/2025' },
      { id: 'ORD-000868', firstName: 'Laura', lastName: 'Mabry', dob: '11/11/1988', provider: 'Provider not listed', product: 'Pregnancy Support Kit', insurance: 'Anthem Blue Cross', sourceStatus: 'Physician Info Requested', statusClass: 'bg-amber-bg text-amber', date: '07/11/2026' },
      { id: 'ORD-000869', firstName: 'Madison', lastName: 'Chilcutt', dob: '01/12/2004', provider: 'Provider not listed', product: 'Pregnancy Support Kit', insurance: 'United Healthcare Community Plan', sourceStatus: 'Physician Info Requested', statusClass: 'bg-amber-bg text-amber', date: '10/21/2025' },
      { id: 'ORD-000870', firstName: 'Sari', lastName: 'Gutierrez', dob: '03/03/2000', provider: 'Baptist Medical Group Women\'s Health Center of Union City', product: 'Momcozy Double Wearable Breast Pump', insurance: 'United Healthcare Community Plan', sourceStatus: 'Prescription Requested', statusClass: 'bg-blue-bg text-blue', date: '02/05/2026' },
      { id: 'ORD-000871', firstName: 'Sinthia', lastName: 'Abrego', dob: '11/04/1989', provider: 'Provider not listed', product: 'Pregnancy Support Kit', insurance: 'Wellpoint', sourceStatus: 'Physician Info Requested', statusClass: 'bg-amber-bg text-amber', date: '03/08/2026' },
      { id: 'ORD-000872', firstName: 'Suheda', lastName: 'Begum', dob: '06/24/2001', provider: 'KHOSHABA, AUDISHO', product: 'Momcozy Double Wearable Breast Pump', insurance: 'Blue Cross Community Health', sourceStatus: 'Prescription Requested', statusClass: 'bg-blue-bg text-blue', date: '02/12/2026' },
      { id: 'ORD-000873', firstName: 'Leticia', lastName: 'Delarosa', dob: '10/24/2001', provider: 'Dr Hadeel', product: 'Pregnancy Support Kit', insurance: 'Michigan Medicaid', sourceStatus: 'Prescription Requested', statusClass: 'bg-blue-bg text-blue', date: '01/25/2026' },
      { id: 'ORD-000874', firstName: 'Hayley', lastName: 'Gow', dob: '11/26/1999', provider: 'Provider not listed', product: 'Pregnancy Support Kit', insurance: 'Wellpoint', sourceStatus: 'Physician Info Requested', statusClass: 'bg-amber-bg text-amber', date: '04/28/2026' },
      { id: 'ORD-000875', firstName: 'Doris', lastName: 'Manchame', dob: '04/11/2002', provider: 'Provider not listed', product: 'Pregnancy Support Kit', insurance: '6 Degrees Health', sourceStatus: 'Physician Info Requested', statusClass: 'bg-amber-bg text-amber', date: '11/04/2025' },
      { id: 'ORD-000876', firstName: 'Peyton', lastName: 'Tockey', dob: '02/18/1994', provider: 'Dr. Jeremy Avila', product: 'Momcozy Double Wearable Breast Pump', insurance: 'United Healthcare Community Plan', sourceStatus: 'Prescription Requested', statusClass: 'bg-blue-bg text-blue', date: '06/02/2026' },
      { id: 'ORD-000877', firstName: 'Leah', lastName: 'Garcia', dob: '04/19/1996', provider: 'Crowe, Women\'s OB Nashville', product: 'Momcozy Double Wearable Breast Pump', insurance: 'Anthem Blue Cross', sourceStatus: 'Missing Fax Number', statusClass: 'bg-red-bg text-red', date: '08/01/2026' },
      { id: 'ORD-000878', firstName: 'Sarah', lastName: 'Albertson', dob: '08/28/2002', provider: 'Dr. Paul Grayson Smith, D.O', product: 'Rumble Tuff EZ Express with Classic', insurance: 'TennCare', sourceStatus: 'Missing Fax Number', statusClass: 'bg-red-bg text-red', date: '05/27/2026' }
    ];

    let activeFilter = 'all';

    function renderOrders() {
      const query = document.getElementById('table-search').value.trim().toLowerCase();
      const insurance = document.getElementById('insurance-filter').value;
      const state = document.getElementById('state-filter').value;
      const stateByInsurance = {'United Healthcare Community Plan': 'Tennessee', 'Anthem Blue Cross': 'Ohio', Wellpoint: 'Michigan', 'Blue Cross Community Health': 'Ohio', 'Michigan Medicaid': 'Michigan', '6 Degrees Health': 'Tennessee', TennCare: 'Tennessee'};

      const visible = orders.filter(order => {
        const matchesFilter = activeFilter === 'all' || order.sourceStatus === activeFilter;
        const matchesInsurance = insurance === 'all' || order.insurance === insurance;
        const matchesState = state === 'all' || stateByInsurance[order.insurance] === state;
        const matchesQuery = !query || Object.values(order).join(' ').toLowerCase().includes(query);
        return matchesFilter && matchesInsurance && matchesState && matchesQuery;
      });

      document.getElementById('order-body').innerHTML = visible.length ? visible.map(order => `
        <tr class="border-b border-line hover:bg-surface transition">
          <td class="p-3"><a class="font-mono font-bold text-primary hover:underline text-sm" href="OrderDetails/OrderDetailsView.html?orderId=${order.id}">${order.id}</a></td>
          <td class="p-3 text-text font-medium text-sm">${order.firstName} ${order.lastName}</td>
          <td class="p-3 text-muted text-sm">${order.dob}</td>
          <td class="p-3 text-text text-sm truncate" title="${order.provider}">${order.provider}</td>
          <td class="p-3">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap ${order.statusClass}">
              <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
              ${order.sourceStatus}
            </span>
          </td>
          <td class="p-3 text-muted text-sm">${order.date}</td>
        </tr>
      `).join('') : `<tr><td class="p-8 text-center text-muted text-sm" colspan="6">No orders match the current search and status filter.</td></tr>`;
    }

    document.querySelectorAll('.stat-card').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stat-card').forEach(c => {
          c.classList.remove('border-primary', 'ring-2', 'ring-primary/20', 'bg-[#FDFBFE]');
          c.classList.add('border-line', 'bg-white');
        });
        btn.classList.remove('border-line', 'bg-white');
        btn.classList.add('border-primary', 'ring-2', 'ring-primary/20', 'bg-[#FDFBFE]');
        activeFilter = btn.dataset.filter;
        renderOrders();
      });
    });

    document.getElementById('table-search').addEventListener('input', renderOrders);
    document.getElementById('insurance-filter').addEventListener('change', renderOrders);
    document.getElementById('state-filter').addEventListener('change', renderOrders);

    // Account / Role Switcher Logic
    let activeRole = 'operations';
    let roleSwitcherOpen = false;

    const roleData = {
      operations: { name: 'Jane Doe', email: 'jane.doe@h2m.org', initials: 'J', color: '#6750a4', label: 'Operations' },
      administrator: { name: 'Priya Patel', email: 'p.patel@h2m.org', initials: 'P', color: '#1967D2', label: 'Administrator' }
    };

    document.getElementById('role-switcher-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      roleSwitcherOpen = !roleSwitcherOpen;
      document.getElementById('role-switcher-dropdown').classList.toggle('hidden', !roleSwitcherOpen);
    });

    document.addEventListener('click', (e) => {
      const container = document.getElementById('role-switcher-container');
      if (container && !container.contains(e.target)) {
        roleSwitcherOpen = false;
        document.getElementById('role-switcher-dropdown').classList.add('hidden');
      }
    });

    function selectRole(role) {
      activeRole = role;
      roleSwitcherOpen = false;
      document.getElementById('role-switcher-dropdown').classList.add('hidden');

      const current = roleData[role];
      const avatar = document.getElementById('active-avatar');
      avatar.style.backgroundColor = current.color;
      avatar.innerText = current.initials;

      document.getElementById('active-name').innerText = current.name;
      const label = document.getElementById('active-label');
      label.innerText = current.label;
      label.style.color = current.color;

      const opsBtn = document.getElementById('role-opt-operations');
      const adminBtn = document.getElementById('role-opt-administrator');
      const checkOps = document.getElementById('check-operations');
      const checkAdmin = document.getElementById('check-administrator');

      if (role === 'operations') {
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkOps.classList.remove('hidden');
        checkAdmin.classList.add('hidden');
      } else {
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkAdmin.classList.remove('hidden');
        checkOps.classList.add('hidden');
      }

      showToast(`Switched to ${current.label} view — ${current.name}`);
    }

    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    renderOrders();
  </script>
</body>
</html>
