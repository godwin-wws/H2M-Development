  <script>

      { id: 'ORD-000871', patientName: 'Sinthia Abrego', dob: '11/04/1989', provider: 'Provider not listed', insurance: 'Wellpoint', queue: 'exceptions', statusLabel: 'Exceptions', statusClass: 'bg-red-bg text-red', receivedDate: '2026-08-22', assignedTo: null, exceptionReason: 'ERR_INVALID_UPLOADS' },
      { id: 'ORD-000872', patientName: 'Suheda Begum', dob: '06/24/2001', provider: 'KHOSHABA, AUDISHO', insurance: 'Blue Cross Community Health', queue: 'new', statusLabel: 'New Intake', statusClass: 'bg-blue-bg text-blue', receivedDate: '2026-08-26', assignedTo: null, exceptionReason: '—' },
      { id: 'ORD-000873', patientName: 'Leticia Delarosa', dob: '10/24/2001', provider: 'Dr Hadeel', insurance: 'Michigan Medicaid', queue: 'review', statusLabel: 'Pending Review', statusClass: 'bg-amber-bg text-amber', receivedDate: '2026-08-23', assignedTo: null, exceptionReason: 'Validation Failure' },
      { id: 'ORD-000874', patientName: 'Hayley Gow', dob: '11/26/1999', provider: 'Provider not listed', insurance: 'Wellpoint', queue: 'verification', statusLabel: 'Pending Verification', statusClass: 'bg-amber-bg text-amber', receivedDate: '2026-08-26', assignedTo: 'MR', exceptionReason: '—' },
      { id: 'ORD-000875', patientName: 'Doris Manchame', dob: '04/11/2002', provider: 'Provider not listed', insurance: '6 Degrees Health', queue: 'exceptions', statusLabel: 'Exceptions', statusClass: 'bg-red-bg text-red', receivedDate: '2026-08-21', assignedTo: 'jane.doe@h2m.com', exceptionReason: 'Missing Mandatory Documentation' },
      { id: 'ORD-000876', patientName: 'Peyton Tockey', dob: '02/18/1994', provider: 'Dr. Jeremy Avila', insurance: 'United Healthcare Community Plan', queue: 'fax', statusLabel: 'Ready to Fax', statusClass: 'bg-green-bg text-green', receivedDate: '2026-08-26', assignedTo: null, exceptionReason: '—' },
      { id: 'ORD-000877', patientName: 'Leah Garcia', dob: '04/19/1996', provider: 'Crowe, Women\'s OB Nashville', insurance: 'Anthem Blue Cross', queue: 'exceptions', statusLabel: 'Exceptions', statusClass: 'bg-red-bg text-red', receivedDate: '2026-08-24', assignedTo: null, exceptionReason: 'Missing Fax Number' },
      { id: 'ORD-000878', firstName: 'Sarah', lastName: 'Albertson', dob: '08/28/2002', provider: 'Dr. Paul Grayson Smith, D.O', insurance: 'TennCare', queue: 'new', statusLabel: 'New Intake', statusClass: 'bg-blue-bg text-blue', receivedDate: '2026-08-26', assignedTo: null, exceptionReason: '—' }
    ];

    let activeAssignmentView = 'team';
    let activeStatusQueue = 'all';
    let currentPage = 1;
    const pageSize = 10;

    function setAssignmentView(view) {
      activeAssignmentView = view;
      const teamBtn = document.getElementById('tab-team-queue');
      const mineBtn = document.getElementById('tab-my-queue');
      const checkTeam = document.getElementById('icon-check-team');
      const checkMine = document.getElementById('icon-check-mine');

      if (view === 'team') {
        teamBtn.className = "h-full px-6 text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 border-r border-[#79747E] bg-[#E8DEF8] text-[#4A4459]";
        mineBtn.className = "h-full px-6 text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 bg-transparent text-[#1C1B1F] hover:bg-[#F3EDF7]";
        checkTeam.classList.remove('hidden');
        checkMine.classList.add('hidden');
      } else {
        mineBtn.className = "h-full px-6 text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 bg-[#E8DEF8] text-[#4A4459]";
        teamBtn.className = "h-full px-6 text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 border-r border-[#79747E] bg-transparent text-[#1C1B1F] hover:bg-[#F3EDF7]";
        checkMine.classList.remove('hidden');
        checkTeam.classList.add('hidden');
      }
      currentPage = 1;
      renderQueue();
    }

    function setStatusQueue(queue) {
      activeStatusQueue = queue;
      document.querySelectorAll('.chip-btn').forEach(btn => {
        if (btn.dataset.queue === queue) {
          btn.className = "chip-btn active px-3.5 py-1.5 rounded-full text-sm font-bold bg-primary text-white transition shadow-sm";
        } else {
          btn.className = "chip-btn px-3.5 py-1.5 rounded-full text-sm font-medium text-muted bg-white hover:bg-[#F3EDF7] border border-line transition";
        }
      });
      currentPage = 1;
      renderQueue();
    }

    function updateChipCounts() {
      const assignmentFiltered = queueOrders.filter(order => activeAssignmentView === 'team' ? !order.assignedTo : order.assignedTo === 'MR');

      document.getElementById('chip-count-all').innerText = assignmentFiltered.length;
      document.getElementById('chip-count-new').innerText = assignmentFiltered.filter(i => i.queue === 'new').length;
      document.getElementById('chip-count-verification').innerText = assignmentFiltered.filter(i => i.queue === 'verification').length;
      document.getElementById('chip-count-review').innerText = assignmentFiltered.filter(i => i.queue === 'review').length;
      document.getElementById('chip-count-fax').innerText = assignmentFiltered.filter(i => i.queue === 'fax').length;
      document.getElementById('chip-count-exceptions').innerText = assignmentFiltered.filter(i => i.queue === 'exceptions').length;
    }

    function renderTableHeaders() {
      const thead = document.getElementById('table-head');
      const isExceptionsView = activeStatusQueue === 'exceptions';

      if (isExceptionsView) {
        thead.innerHTML = `
          <tr class="bg-primary text-white text-[11px] font-bold tracking-wider">
            <th class="py-3 px-3">ORDER ID</th>
            <th class="py-3 px-3">PATIENT NAME</th>
            <th class="py-3 px-3">DOB</th>
            <th class="py-3 px-3">PROVIDER</th>
            <th class="py-3 px-3">STATUS / QUEUE</th>
            <th class="py-3 px-3">RECEIVED DATE</th>
            <th class="py-3 px-3">ASSIGNED USER</th>
            <th class="py-3 px-3">EXCEPTION REASON</th>
          </tr>
        `;
      } else {
        thead.innerHTML = `
          <tr class="bg-primary text-white text-[11px] font-bold tracking-wider">
            <th class="py-3 px-3">ORDER ID</th>
            <th class="py-3 px-3">PATIENT NAME</th>
            <th class="py-3 px-3">DOB</th>
            <th class="py-3 px-3">PROVIDER</th>
            <th class="py-3 px-3">STATUS / QUEUE</th>
            <th class="py-3 px-3">RECEIVED DATE</th>
          </tr>
        `;
      }
    }

    function renderQueue() {
      updateChipCounts();
      renderTableHeaders();

      // Dynamically update section title based on active view tab
      document.getElementById('queue-panel-title').innerText = activeAssignmentView === 'team' ? 'Team Queue' : 'My Queue';

      const isExceptionsView = activeStatusQueue === 'exceptions';
      const query = document.getElementById('table-search').value.trim().toLowerCase();
      const insurance = document.getElementById('insurance-filter').value;

      const filtered = queueOrders.filter(order => {
        const matchesAssignment = activeAssignmentView === 'team' ? !order.assignedTo : order.assignedTo === 'MR';
        const matchesStatus = activeStatusQueue === 'all' || order.queue === activeStatusQueue;
        const matchesQuery = !query || Object.values(order).join(' ').toLowerCase().includes(query);
        const matchesInsurance = insurance === 'all' || order.insurance === insurance;

        return matchesAssignment && matchesStatus && matchesQuery && matchesInsurance;
      });

      const totalRecords = filtered.length;
      const totalPages = Math.ceil(totalRecords / pageSize) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = Math.min(startIndex + pageSize, totalRecords);
      const visible = filtered.slice(startIndex, endIndex);

      const statusElem = document.getElementById('pagination-status');
      if (totalRecords === 0) {
        statusElem.innerText = "Showing 0-0 of 0";
      } else {
        statusElem.innerText = `Showing ${startIndex + 1}-${endIndex} of ${totalRecords}`;
      }

      document.getElementById('prev-page-btn').disabled = (currentPage <= 1);
      document.getElementById('next-page-btn').disabled = (currentPage >= totalPages || totalRecords === 0);

      const tbody = document.getElementById('table-body');

      if (!visible.length) {
        const colSpan = isExceptionsView ? 8 : 6;
        tbody.innerHTML = `<tr><td class="p-8 text-center text-muted text-xs font-medium" colspan="${colSpan}">No orders match the selected queue and assignment filters.</td></tr>`;
        return;
      }

      // Link navigates directly to OrderDetails/OrderDetailsView.html with origin=workqueue query param
      tbody.innerHTML = visible.map(order => `
        <tr class="border-b border-line hover:bg-[#F3EDF7]/50 transition">
          <td class="p-3"><a class="font-mono font-bold text-primary hover:underline text-sm" href="OrderDetails/OrderDetailsView.html?orderId=${order.id}&origin=workqueue">${order.id}</a></td>
          <td class="p-3 text-text font-medium text-sm">${order.patientName}</td>
          <td class="p-3 text-muted text-sm font-mono">${order.dob}</td>
          <td class="p-3 text-text text-sm truncate" title="${order.provider}">${order.provider}</td>
          <td class="p-3">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap ${order.statusClass}">
              <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
              ${order.statusLabel}
            </span>
          </td>
          <td class="p-3 text-muted text-sm font-mono">${order.receivedDate}</td>
          ${isExceptionsView ? `<td class="p-3 text-muted text-sm font-mono">${order.assignedTo || 'Unassigned'}</td><td class="p-3 font-bold text-sm text-red">${order.exceptionReason}</td>` : ''}
        </tr>
      `).join('');
    }

    function changePage(direction) {
      currentPage += direction;
      renderQueue();
    }

    // Role Switcher Logic
    let activeRole = 'operations';
    let roleSwitcherOpen = false;

    const roleData = {
      operations: { name: 'Jane Doe', email: 'jane.doe@h2m.org', initials: 'J', color: '#6750a4', label: 'Operations' },
      administrator: { name: 'Priya Patel', email: 'p.patel@h2m.org', initials: 'P', color: '#1967D2', label: 'Administrator' }
    };

    document.getElementById('role-switcher-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      roleSwitcherOpen = !roleSwitcherOpen;
      document.getElementById('role-switcher-dropdown').classList.toggle('hidden', !roleSwitcherOpen);
    });

    document.addEventListener('click', (e) => {
      const container = document.getElementById('role-switcher-container');
      if (container && !container.contains(e.target)) {
        roleSwitcherOpen = false;
        document.getElementById('role-switcher-dropdown').classList.add('hidden');
      }
    });

    function selectRole(role) {
      activeRole = role;
      roleSwitcherOpen = false;
      document.getElementById('role-switcher-dropdown').classList.add('hidden');

      const current = roleData[role];
      const avatar = document.getElementById('active-avatar');
      avatar.style.backgroundColor = current.color;
      avatar.innerText = current.initials;

      document.getElementById('active-name').innerText = current.name;
      const label = document.getElementById('active-label');
      label.innerText = current.label;
      label.style.color = current.color;

      const opsBtn = document.getElementById('role-opt-operations');
      const adminBtn = document.getElementById('role-opt-administrator');
      const checkOps = document.getElementById('check-operations');
      const checkAdmin = document.getElementById('check-administrator');

      if (role === 'operations') {
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkOps.classList.remove('hidden');
        checkAdmin.classList.add('hidden');
      } else {
        adminBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-[#f3edf7]";
        opsBtn.className = "w-full flex items-center gap-3 px-4 py-3 text-left border-none cursor-pointer transition-colors bg-white hover:bg-[#fef7ff]";
        checkAdmin.classList.remove('hidden');
        checkOps.classList.add('hidden');
      }

      showToast(`Switched to ${current.label} view — ${current.name}`);
    }

    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    document.getElementById('table-search').addEventListener('input', () => {
      currentPage = 1;
      renderQueue();
    });
    document.getElementById('insurance-filter').addEventListener('change', () => {
      currentPage = 1;
      renderQueue();
    });
    document.getElementById('state-filter').addEventListener('change', () => {
      currentPage = 1;
      renderQueue();
    });

    renderQueue();
  </script>
</body>
</html>
